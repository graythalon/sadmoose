name: Build Drift for Windows and Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows app
        run: dotnet publish apps/windows/Drift.Windows.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-Windows-x64
          path: artifacts/windows/Drift.exe

  release:
    name: Publish Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Drift-Windows-x64
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/Drift.exe --repo "$GITHUB_REPOSITORY" --title "Drift $GITHUB_REF_NAME" --generate-notes

  android:
    name: Android client
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android app
        run: gradle -p apps/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-Android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
