name: Build native apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows app
        run: dotnet publish apps/windows/Drift.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-Windows-x64
          path: artifacts/windows/

  macos:
    name: macOS client (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app bundle
        shell: bash
        run: |
          build_log="$RUNNER_TEMP/drift-macos-build.log"
          bash apps/macos/build-macos.sh >"$build_log" 2>&1
          build_status=$?
          cat "$build_log"
          if [ "$build_status" -ne 0 ]; then
            tail -n 20 "$build_log" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit "$build_status"
          fi
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent apps/macos/.build/Drift.app apps/macos/.build/Drift-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-macOS-${{ matrix.architecture }}
          path: apps/macos/.build/Drift-macOS.zip

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android app
        run: gradle -p apps/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-Android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
